<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Regional growth intelligence map</title>
  </head>
  <body>
    <a class="skip-link" href="#panel-body">Skip to list</a>
    <div class="app" id="app">
      <header class="header">
        <div class="header-title">
          <h1><a href="#" id="home-link">Regional growth intelligence map</a></h1>
          <p id="last-checked"></p>
        </div>
        <form class="search" role="search" onsubmit="return false">
          <label for="search">Search schemes and assets</label>
          <input id="search" type="search" autocomplete="off" placeholder="Name, place or status" />
        </form>
      </header>
      <main class="main" id="main">
        <div class="map-wrap">
          <div id="map"></div>
          <details class="legend" id="legend">
            <summary>Key and layers</summary>
            <div id="legend-body"></div>
          </details>
        </div>
        <section class="panel" id="panel" aria-label="Details">
          <div class="sheet-handle" id="sheet-handle">
            <span class="grabber" aria-hidden="true"></span>
            <button type="button" id="sheet-button" aria-expanded="false">Show list</button>
          </div>
          <nav class="tabs" id="tabs" aria-label="Views"></nav>
          <div class="panel-body" id="panel-body" tabindex="-1"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
